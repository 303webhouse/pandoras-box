name: Secret scan

# R-IV.605(d)4. On 2026-09-30 two tracked files were found carrying a production database URL
# with its password, and one carried a Discord webhook token, in a repo that had been public for
# a week. GitHub's own push protection stopped neither, so this repo needs its own control.
#
# Runs on EVERY push and pull request with no path filter, deliberately. A path filter is how a
# credential in a file nobody listed slips through, and the scan takes seconds.

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  scan:
    name: Refuse credential-shaped strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan every tracked file
        run: python scripts/secret_scan.py --all
      - name: Prove the scanner still catches one
        # A scan that cannot fail is a scan that passes. This plants a fake credential, asserts
        # the scanner refuses it, and removes it — so a green result above means the rule held,
        # not that the scanner was broken.
        run: |
          set -e
          printf 'API_KEY = "%s"\n' "AKIAIOSFODNN7EXAMPLEX" > /tmp/planted.py
          printf 'db = "postgresql://u:hunter2hunter2hunter2@h:5432/d"\n' >> /tmp/planted.py  # secret-scan: allow the planted fake this job exists to catch
          if python scripts/secret_scan.py --path /tmp/planted.py; then
            echo "FAIL: the scanner passed a planted credential"
            exit 1
          fi
          echo "the scanner refused the planted credential, as it must"
