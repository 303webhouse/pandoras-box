[pytest]
addopts = --ignore=stable_market_board_LATEST

# R-IV.581(c): EVERY test directory, so the default run collects all of them.
#
# Three directories hold tests, and only one was ever run.
#
# `backend/hub_mcp/tests` held three failing trade_ideas tests for an unknown length of time --
# they patched names the module imports INSIDE its functions, so the attributes did not exist --
# and nobody saw them, because a suite outside the run is a suite that cannot fail (R-IV.419(c)).
# `backend/stable_engine/tests` was orphaned the same way. Its 24 tests pass, which is luck
# rather than evidence: nothing was checking.
#
# Named here rather than left to whoever remembers the extra paths. Paths are relative to this
# file. The run is invoked from `backend/`, because the repo root holds its own `config/` which
# shadows `backend/config` when the root reaches sys.path first.
testpaths =
    backend/tests
    backend/hub_mcp/tests
    backend/stable_engine/tests
